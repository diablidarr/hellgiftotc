name: Build Windows Client (hellgift.online)

# Kompiluje OTClient - Redemption (15.25) z folderu ./hellgiftotc w chmurze
# i wrzuca gotowy pakiet klienta jako artefakt do pobrania.
# Uruchomienie: zakladka Actions -> "Build Windows Client (hellgift.online)" -> Run workflow.
# Po zakonczeniu: wejdz w run -> sekcja Artifacts -> pobierz otclient-redemption-hellgift-windows.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths: [ "hellgiftotc/**", ".github/workflows/build-windows.yml" ]

permissions:
  contents: read

defaults:
  run:
    working-directory: hellgiftotc

jobs:
  build:
    name: Compile Windows x64 (CMake Release)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Read vcpkg baseline from vcpkg.json
        shell: pwsh
        run: |
          $json = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          "VCPKG_GIT_COMMIT_ID=$($json.'builtin-baseline')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitURL: "https://github.com/microsoft/vcpkg.git"
          vcpkgGitCommitId: ${{ env.VCPKG_GIT_COMMIT_ID }}

      - name: Configure & build (preset windows-release)
        uses: lukka/run-cmake@v10
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
          VCPKG_MAX_CONCURRENCY: "2"
        with:
          cmakeListsTxtPath: ${{ github.workspace }}/hellgiftotc/CMakeLists.txt
          configurePreset: windows-release
          buildPreset: windows-release
          configurePresetAdditionalArgs: "['-DTOGGLE_BIN_FOLDER=ON', '-DOPTIONS_ENABLE_IPO=OFF', '-DOTCLIENT_BUILD_TESTS=OFF']"

      - name: Assemble runnable client package
        shell: pwsh
        run: |
          $dist = "dist/otclient-hellgift"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item build/windows-release/bin/* $dist -Recurse -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path "$dist/otclient.exe")) {
            Get-ChildItem -Recurse -Filter otclient.exe build | ForEach-Object { Copy-Item $_.FullName $dist -Force }
          }
          Copy-Item init.lua,otclientrc.lua,cacert.pem $dist -Force -ErrorAction SilentlyContinue
          Copy-Item data,modules,mods $dist -Recurse -Force
          Write-Host "Zawartosc pakietu:"; Get-ChildItem $dist | Select-Object Name

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: otclient-redemption-hellgift-windows
          path: hellgiftotc/dist/otclient-hellgift
          if-no-files-found: error
